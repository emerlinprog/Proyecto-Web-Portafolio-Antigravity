[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  # Página IA Aplicada fusionada dentro de Servicios
  from = "/ia_aplicada.html"
  to = "/servicios.html#ia"
  status = 301
  force = true

[[redirects]]
  # Permitir que los archivos HTML estáticos se sirvan primero
  from = "/*.html"
  to = "/:splat.html"
  status = 200

[[redirects]]
  # Redirigir el resto al SPA de React
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

