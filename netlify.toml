[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# La canonicalización se controla de forma explícita en public/_redirects.
# Evita que el postprocesado de Netlify cree una segunda convención de URLs.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
